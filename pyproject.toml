[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "langgraph-recovery-lab"
version = "0.1.0"
description = "An offline lab for observing LangGraph recovery after parallel failure."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "111111tjb-cell" }]
dependencies = []

[project.scripts]
recovery-lab = "recovery_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["recovery_lab"]

[tool.hatch.build.targets.wheel.force-include]
"requirements" = "recovery_lab/_data/requirements"
"provenance.json" = "recovery_lab/_data/provenance.json"

[tool.hatch.build.targets.sdist]
include = ["/recovery_lab", "/requirements", "/provenance.json", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/pyproject.toml"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
