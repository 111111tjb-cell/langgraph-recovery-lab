<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 392" role="img" aria-labelledby="title desc"><title id="title">Measured LangGraph recovery comparison</title><desc id="desc">Baseline lost completed work; candidate preserved it. First recorded case from each environment.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#e8eef9}.title{font-size:25px;font-weight:700}.label{font-size:13px;letter-spacing:2px;fill:#9eb4cf}.count{font-size:64px;font-weight:700}.body{font-size:17px}.small{font-size:13px;fill:#a9bbd1}</style><rect width="1000" height="392" rx="22" fill="#0c1524"/><text x="36" y="50" class="title">Does completed work survive a parallel failure?</text><text x="36" y="77" class="small">Actual local run · A fails once · B finishes later · SQLite · fresh-process resume</text><g transform="translate(36,100)"><rect width="448" height="194" rx="18" fill="#172337" stroke="#2a3b51"/><text x="24" y="34" class="label">BASELINE</text><text x="24" y="103" class="count">2</text><text x="83" y="99" class="body">total calls to node B</text><text x="24" y="142" class="body">B result: not saved</text><text x="24" y="173" class="small">completed-result-lost</text></g><g transform="translate(516,100)"><rect width="448" height="194" rx="18" fill="#172337" stroke="#2a3b51"/><text x="24" y="34" class="label">CANDIDATE</text><text x="24" y="103" class="count">1</text><text x="83" y="99" class="body">total calls to node B</text><text x="24" y="142" class="body">B result: saved</text><text x="24" y="173" class="small">completed-result-preserved</text></g><text x="36" y="329" class="body" style="fill:#34d399">Baseline lost completed work; candidate preserved it.</text><text x="36" y="359" class="small">First case only. Full matrix and source fingerprints are in comparison.json. No exactly-once guarantee.</text></svg>
