name: Recovery lab checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.16.9
      - run: python -m ruff check recovery_lab tests scripts
      - run: python -m ruff format --check recovery_lab tests scripts
      - run: python -m scripts.build_demo --check
      - run: python -m unittest discover -s tests -v

  recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m recovery_lab prepare
      - name: Configure candidate interpreter for integration tests
        run: python -c "import os; from pathlib import Path; from recovery_lab.prepare import python_in; p=python_in(Path('.venvs/candidate')).resolve(); open(os.environ['GITHUB_ENV'],'a',encoding='utf-8').write('RECOVERY_LAB_TEST_PYTHON='+str(p)+'\n')"
      - run: python -m unittest discover -s tests -v
      - run: python -m recovery_lab compare --matrix --include-cancelled --output artifacts/ci
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: recovery-${{ matrix.os }}
          path: artifacts/ci
          if-no-files-found: ignore
